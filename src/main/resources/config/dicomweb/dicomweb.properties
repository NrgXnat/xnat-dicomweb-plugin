# DICOMweb Plugin Initial Configuration
# This file is loaded when the plugin is first installed
# After installation, these values can be modified via XNAT Admin UI
# (Administer > Plugin Settings > DICOMweb Plugin Configuration)

# ====================================
# QIDO-RS Pagination Settings
# ====================================

# Default page size for QIDO-RS queries when limit parameter is not specified
# Recommended: 50-200 for typical use cases
dicomweb.defaultPageSize=100

# Maximum allowed page size for QIDO-RS queries
# Client requests exceeding this will be capped at this value
# Recommended: 500-2000 depending on server capacity
dicomweb.maxPageSize=1000

# ====================================
# Multipart Upload Settings
# ====================================

# Memory threshold for multipart parsing in bytes
# Files larger than this will be written to disk temporary files
# Files smaller will be kept in memory for faster processing
# Default: 10485760 (10 MB)
# Adjust based on available memory:
#   - High memory systems: 52428800 (50 MB)
#   - Low memory systems: 5242880 (5 MB)
dicomweb.memoryThreshold=10485760

# ====================================
# STOW-RS Settings
# ====================================

# Default import strategy for STOW-RS uploads
# Options:
#   - DirectArchive (default): Direct archive writing, bypasses prearchive
#   - GradualDicomImporter: Full XNAT import pipeline with prearchive
dicomweb.defaultStrategy=GradualDicomImporter

# Build delay for DirectArchive multi-batch uploads (milliseconds)
# When > 0, defers build/archive until no new files arrive within this window.
# Allows multiple STOW-RS requests for the same study to be grouped into one build.
# Set to 0 for immediate build (original behavior).
# Default: 5000 (5 seconds)
dicomweb.buildDelayMs=5000

# ====================================
# BulkData Settings
# ====================================

# Threshold for using BulkDataURI in bytes
# DICOM attributes with binary data larger than this will be
# returned as BulkDataURI references instead of inline values in metadata responses
# Default: 1024 (1 KB)
# Recommendations:
#   - Smaller threshold (512-1024): More BulkDataURIs, smaller JSON responses
#   - Larger threshold (4096-8192): Fewer BulkDataURIs, larger JSON responses
dicomweb.bulkDataThreshold=1024

# ====================================
# Base URL for HTTP access to DICOM
# ====================================

# If empty, use XNAT site URL as base
# May be set to another URL for special cases like shadow servers
dicomweb.baseUrl=

# ====================================
# Site-Wide Querying Settings
# ====================================

# Master toggle for site-wide DICOMweb querying (without project scoping)
# When false, site-wide endpoints (/xapi/dicomweb/studies/...) return 404
dicomweb.siteWideEnabled=true

# Project filter mode for site-wide queries
# Options:
#   - blacklist (default): Include all projects EXCEPT those in projectList
#   - whitelist: Exclude all projects EXCEPT those in projectList
dicomweb.filterMode=blacklist

# Comma-separated list of project IDs for the filter
# Interpretation depends on filterMode:
#   - blacklist mode: these projects are EXCLUDED from site-wide queries
#   - whitelist mode: ONLY these projects are INCLUDED in site-wide queries
# An empty whitelist includes all projects (to prevent accidental lockout)
dicomweb.projectList=