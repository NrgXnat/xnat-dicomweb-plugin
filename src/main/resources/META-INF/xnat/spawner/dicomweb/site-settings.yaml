####
#### DICOMweb Plugin Site Settings
####

dicomwebConfigPanel:
    kind: panel.form
    name: dicomwebConfigPanel
    id: dicomweb-config-form
    label: "DICOMweb Plugin Configuration"
    method: POST
    contentType: json
    action: "/xapi/dicomweb/prefs"
    load: "/xapi/dicomweb/prefs"
    contents:
        description:
            tag: div.message
            contents: >
                Configure the DICOMweb plugin settings. Changes take effect immediately without restart.
                Note: STOW-RS memory threshold (dicomweb.memoryThreshold) must be configured in properties file and requires restart.

        performanceHeader:
            tag: h3
            contents: "Performance Settings"

        enableMetadataCache:
            kind: panel.input.switchbox
            name: enableMetadataCache
            label: Enable Database Metadata Caching
            description: >
                When enabled, DICOM metadata is extracted and cached in the database
                when sessions are archived, providing faster DICOMweb query responses.
                When disabled, DICOMweb queries read metadata directly from DICOM files,
                which avoids caching overhead but results in slower query responses.
                Changes take effect for newly archived sessions; existing cached data
                is not affected.

        qidoBehaviorHeader:
            tag: h3
            contents: "QIDO-RS Response Settings"

        dicomWebUrl:
            kind: panel.input.text
            name: baseUrl
            label: DICOMweb Base URL
            validation: "onblur"
            element:
                title: Base URL for Retrieve URL entries in QIDO-RS responses
            description: >
                Base URL used to set Retrieve URL attribute values in QIDO-RS Instance-level responses.
                Defaults to the XNAT Site URL, which is usually correct.

        defaultPageSize:
            kind: panel.input.text
            name: defaultPageSize
            label: Default Page Size
            validation: "onblur integer greaterThan:0"
            element:
                title: Default number of results per page when limit is not specified
            description: >
                Default page size for QIDO-RS queries when the limit parameter is not specified.
                Recommended: 50-200 for typical use cases. Default: 100

        maxPageSize:
            kind: panel.input.text
            name: maxPageSize
            label: Maximum Page Size
            validation: "onblur integer greaterThan:0"
            element:
                title: Maximum allowed page size - requests exceeding this will be capped
            description: >
                Maximum allowed page size for QIDO-RS queries. Client requests exceeding this value
                will be capped at this maximum. Recommended: 500-2000 depending on server capacity. Default: 1000

        bulkDataHeader:
            tag: h3
            contents: "WADO-RS BulkData Settings"

        bulkDataThreshold:
            kind: panel.input.text
            name: bulkDataThreshold
            label: BulkData Threshold (bytes)
            validation: "onblur integer greaterThan:0"
            element:
                title: Attributes larger than this will use BulkDataURI references
            description: >
                BulkData threshold in bytes for WADO-RS metadata responses. DICOM attributes with binary data
                larger than this will use BulkDataURI references instead of inline base64 encoding.
                Default: 1024 (1 KB). Smaller threshold (512-1024): More BulkDataURIs, smaller JSON responses.
                Larger threshold (4096-8192): Fewer BulkDataURIs, larger JSON responses

        stowrsHeader:
            tag: h3
            contents: "STOW-RS Upload Settings"

        defaultStrategy:
            kind: panel.select.single
            name: defaultStrategy
            label: Default Import Strategy
            element:
                title: Select the default strategy for STOW-RS uploads
            options:
                GradualDicomImporter: "GradualDicomImporter (Recommended)"
                DirectArchive: "DirectArchive (Experimental)"
            description: >
                Default import strategy for STOW-RS uploads. Can be overridden per-request with ?strategy= parameter.

        strategyWarning:
            tag: div.warning
            element:
                style: "background-color: #fff3cd; border: 1px solid #ffc107; padding: 10px; margin: 10px 0; border-radius: 4px;"
            contents: >
                <strong>Strategy Comparison:</strong><br/>
                <strong>GradualDicomImporter (Recommended):</strong> Full XNAT import pipeline with prearchive.
                Supports session merging, append to existing sessions, and full DICOM validation.<br/><br/>
                <strong>DirectArchive (Experimental):</strong> Direct archive writing, bypasses prearchive.
                <span style="color: #dc3545;"><strong>Limitations:</strong> Cannot append to existing sessions,
                limited concurrent support, no prearchive review. Use only for fresh uploads to new sessions.</span>

####
#### Tab Definition
####

dicomwebConfigTab:
    kind: tab
    name: dicomwebConfigTab
    label: Configuration
    group: dicomwebTabGroup
    contents:
        ${dicomwebConfigPanel}

####
#### Root Site Admin Spawner Config Object
####

siteSettings:
    kind: tabs
    name: dicomwebAdmin
    label: DICOMweb Plugin
    meta:
        tabGroups:
            dicomwebTabGroup: DICOMweb Settings
    contains: tabs
    tabs:
        ${dicomwebConfigTab}
