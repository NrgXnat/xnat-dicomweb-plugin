####
#### DICOMweb Plugin Site Settings
####

dicomwebConfigPanel:
    kind: panel.form
    name: dicomwebConfigPanel
    id: dicomweb-config-form
    label: "DICOMweb Plugin Configuration"
    method: POST
    contentType: json
    action: "/xapi/dicomweb/prefs"
    load: "/xapi/dicomweb/prefs"
    contents:
        description:
            tag: div.message
            contents: >
                Configure the DICOMweb plugin settings. Changes take effect immediately without restart.
                Note: STOW-RS memory threshold (dicomweb.memoryThreshold) must be configured in properties file and requires restart.

        dicomwebLocationHeader:
            tag: h3
            contents: "DICOMweb Server Settings"

        dicomWebUrl:
          kind: panel.input.text
          name: baseUrl
          label: DICOMweb Base URL
          validation: "onblur"
          element:
            title: Base URL for Bulk Data URIs and Retrieve URL entries
          description: >
            Base URL used to set Retrieve URL attribute values in QIDO-RS Instance-level responses
            and Bulk Data URIs in WADO-RS responses.
            Defaults to the XNAT Site URL, which is usually correct.

        qidoBehaviorHeader:
            tag: h3
            contents: "QIDO-RS Response Settings"

        defaultPageSize:
            kind: panel.input.text
            name: defaultPageSize
            label: Default Page Size
            validation: "onblur integer greaterThan:0"
            element:
                title: Default number of results per page when limit is not specified
            description: >
                Default page size for QIDO-RS queries when the limit parameter is not specified.
                Recommended: 50-200 for typical use cases. Default: 100

        maxPageSize:
            kind: panel.input.text
            name: maxPageSize
            label: Maximum Page Size
            validation: "onblur integer greaterThan:0"
            element:
                title: Maximum allowed page size - requests exceeding this will be capped
            description: >
                Maximum allowed page size for QIDO-RS queries. Client requests exceeding this value
                will be capped at this maximum. Recommended: 500-2000 depending on server capacity. Default: 1000

        bulkDataHeader:
            tag: h3
            contents: "WADO-RS BulkData Settings"

        bulkDataThreshold:
            kind: panel.input.text
            name: bulkDataThreshold
            label: BulkData Threshold (bytes)
            validation: "onblur integer greaterThan:0"
            element:
                title: Attributes larger than this will use BulkDataURI references
            description: >
                BulkData threshold in bytes for WADO-RS metadata responses. DICOM attributes with binary data
                larger than this will use BulkDataURI references instead of inline base64 encoding.
                Default: 1024 (1 KB). Smaller threshold (512-1024): More BulkDataURIs, smaller JSON responses.
                Larger threshold (4096-8192): Fewer BulkDataURIs, larger JSON responses

        stowrsHeader:
            tag: h3
            contents: "STOW-RS Upload Settings"

        defaultStrategy:
            kind: panel.select.single
            name: defaultStrategy
            label: Default Import Strategy
            element:
                title: Select the default strategy for STOW-RS uploads
            options:
                DirectArchive: "DirectArchive"
                GradualDicomImporter: "GradualDicomImporter"
            description: >
                Default import strategy for STOW-RS uploads. Can be overridden per-request with ?strategy= parameter.
                DirectArchive writes files directly to the archive. GradualDicomImporter routes through the prearchive.

        siteWideHeader:
            tag: h3
            contents: "Site-Wide DICOMweb Settings"

        siteWideEnabled:
            kind: panel.select.single
            name: siteWideEnabled
            label: Enable Site-Wide Queries
            element:
                title: Enable DICOMweb queries across all projects
            options:
                false: "Disabled"
                true: "Enabled"
            description: >
                When enabled, DICOMweb endpoints are available without a project in the URL
                (e.g., /xapi/dicomweb/studies). Queries return results across all permitted projects,
                subject to user permissions and the project filter below.

        filterMode:
            kind: panel.select.single
            name: filterMode
            label: Project Filter Mode
            element:
                title: How the project list below is applied to site-wide queries
            options:
                blacklist: "Blacklist (exclude listed projects)"
                whitelist: "Whitelist (include only listed projects)"
            description: >
                Controls how the project list is applied to site-wide queries.
                Blacklist mode includes all projects except those listed.
                Whitelist mode includes only the listed projects.

        projectList:
            kind: panel.input.text
            name: projectList
            label: Project List
            element:
                title: Comma-separated list of project IDs for the filter
            description: >
                Comma-separated list of project IDs. In blacklist mode, these projects are excluded
                from site-wide queries. In whitelist mode, only these projects are included.
                Individual projects can also opt out via their own project settings.

####
#### Tab Definition
####

dicomwebConfigTab:
    kind: tab
    name: dicomwebConfigTab
    label: Configuration
    group: dicomwebTabGroup
    contents:
        ${dicomwebConfigPanel}

####
#### Root Site Admin Spawner Config Object
####

siteSettings:
    kind: tabs
    name: dicomwebAdmin
    label: DICOMweb Plugin
    meta:
        tabGroups:
            dicomwebTabGroup: DICOMweb Settings
    contains: tabs
    tabs:
        ${dicomwebConfigTab}
